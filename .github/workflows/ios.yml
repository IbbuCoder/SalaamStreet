# Builds the native iOS app on a macOS runner and runs the SalaamStreetCore
# tests. Runs only when something under ios/ (or this file) changes. No
# signing: the build is for the simulator, so no certificates or secrets.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: SalaamStreetCore tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: ios/SalaamStreetCore
        run: swift test

  build-app:
    name: Build app + Live Activity extension (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project ios/SalaamStreet.xcodeproj \
            -scheme SalaamStreet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*(isolat|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Show errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build/xcodebuild.log | head -300 || true

  ui-tests:
    name: UI tests + screenshots (${{ matrix.appearance }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        appearance: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - name: Boot an iPhone simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone 1[5-7]" | head -5
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone 16 \(([0-9A-F-]+)\)" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl ui "$DEVICE" appearance ${{ matrix.appearance }}
      - name: Test (UI tests and SalaamStreetCore on iOS)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project ios/SalaamStreet.xcodeproj \
            -scheme SalaamStreet \
            -destination "id=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" build/xcodebuild-test.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/screenshots || true
          ls build/screenshots | head -50
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.appearance }}
          path: build/screenshots
          if-no-files-found: warn
